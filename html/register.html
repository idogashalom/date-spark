<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/register.css">
    <title>Register - Date Spark</title>
</head>

<body>
    <main>
        <div class="box">
            <div class="login">
                <form class="loginBx" id="registerForm" novalidate>
                    <h2><i class="fa-solid fa-user-plus"></i> Register</h2>

                    <input
                        type="text"
                        id="regUsername"
                        placeholder="Username"
                        autocomplete="username"
                        required
                    >

                    <input
                        type="email"
                        id="regEmail"
                        placeholder="you@example.com"
                        autocomplete="email"
                        required
                    >

                    <input
                        type="password"
                        id="regPassword"
                        placeholder="Password (min 6 characters)"
                        autocomplete="new-password"
                        required
                    >

                    <input
                        type="password"
                        id="regConfirm"
                        placeholder="Confirm password"
                        autocomplete="new-password"
                        required
                    >

                    <p class="form-message" id="regMessage"></p>

                    <input
                        type="submit"
                        value="Sign Up"
                        id="regSubmit"
                    >

                    <div class="group">
                        <a href="../html/login.html">Already have an account?</a>
                        <a href="../html/login.html">Sign-in</a>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <p class="auth-hint">
        Accounts are stored only in this browser (no server), so use a password you don't reuse elsewhere.
    </p>

    <script src="../js/auth.js"></script>

    <script>
        // If the user is already logged in, send them to the main app.
        AUTH.redirectIfAuthed('/index.html');

        const form = document.getElementById('registerForm');
        const message = document.getElementById('regMessage');
        const submitBtn = document.getElementById('regSubmit');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('regUsername').value;
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPassword').value;
            const confirm = document.getElementById('regConfirm').value;

            message.className = 'form-message error';

            if (password !== confirm) {
                message.textContent = 'Passwords do not match.';
                return;
            }

            submitBtn.disabled = true;
            submitBtn.value = 'Creating account...';

            const result = await AUTH.register(username, email, password);

            if (result.success) {
                message.className = 'form-message success';
                message.textContent = result.message;

                // Main Date Spark page is now index.html.
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 700);

            } else {
                message.className = 'form-message error';
                message.textContent = result.message;

                submitBtn.disabled = false;
                submitBtn.value = 'Sign Up';
            }
        });
    </script>
</body>

</html>
