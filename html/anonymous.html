<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Let Them Say It | Date Spark</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;box-sizing:border-box;font-family:Segoe UI,sans-serif;background:linear-gradient(135deg,#fff0f4,#fff7ed);color:#292631}main{width:min(100%,480px);padding:30px 22px;border-radius:24px;background:#fff;box-shadow:0 20px 55px #c98d9a44}h1{text-align:center;margin:8px 0}.brand,.lead{text-align:center}.brand{font-weight:800}.brand b{color:#ff6b8a}.lead{color:#716c76;line-height:1.5}textarea{box-sizing:border-box;width:100%;min-height:140px;padding:13px;border:2px solid #eedfe3;border-radius:13px;font:inherit}label{display:block;margin-top:16px;font-weight:700}input{width:100%;margin-top:10px}img{max-width:100%;max-height:250px;object-fit:contain;margin-top:12px;border-radius:10px}button{width:100%;min-height:50px;margin-top:16px;border:0;border-radius:12px;background:linear-gradient(110deg,#ff6b8a,#ff8e53);color:#fff;font:700 16px Segoe UI;cursor:pointer}small{display:block;text-align:center;color:#777;margin-top:14px;line-height:1.45}.ok{text-align:center;padding:25px 5px}.hide{display:none}</style></head><body><main id="app">Opening your anonymous inbox...</main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/supabase-config.js"></script><script>(()=>{const a=document.querySelector('#app'),c=window.DATE_SPARK_SUPABASE_CONFIG||{},t=new URLSearchParams(location.search).get('token'),types=['image/jpeg','image/png','image/webp'];let s,f;const esc=x=>{let d=document.createElement('i');d.textContent=x||'';return d.innerHTML};function form(){a.innerHTML=`<div class="brand">&#10084; Date<b>Spark</b></div><h1>LET THEM SAY IT &#128064;</h1><p class="lead">Send an anonymous message. The person who shared this link won't see your name; we never ask for it.</p><form><label>What do you want to say?<textarea maxlength="1000" placeholder="I've always thought you were really cute..." id="m"></textarea></label><label>Add image (JPEG, PNG or WebP, max 5MB)<input id="i" type="file" accept="image/jpeg,image/png,image/webp"></label><img id="p" class="hide" alt="Image preview"><button>Send Anonymously</button><small>Please keep it kind. No online service can promise absolute anonymity.</small></form>`;let i=a.querySelector('#i'),p=a.querySelector('#p');i.onchange=()=>{f=i.files[0];if(!f)return;if(!types.includes(f.type)||f.size>5242880){alert('Choose a JPEG, PNG, or WebP image under 5MB.');i.value='';f=null;return}p.src=URL.createObjectURL(f);p.classList.remove('hide')};a.querySelector('form').onsubmit=send}async function send(e){e.preventDefault();let text=a.querySelector('#m').value.trim();if(!text&&!f)return alert('Write a message or add an image first.');let b=a.querySelector('button');b.disabled=true;b.textContent='Sending...';try{let path=null;if(f){path=`${t}/${crypto.randomUUID()}.${f.name.split('.').pop().toLowerCase()}`;let{error}=await s.storage.from('anonymous-message-images').upload(path,f,{contentType:f.type});if(error)throw 0}let{error}=await s.rpc('submit_anonymous_message',{p_token:t,p_message_text:text||null,p_image_path:path});if(error)throw 0;a.innerHTML='<div class="ok"><h1>Sent &#128064;</h1><p>Your message is on its way.</p></div>'}catch(_){b.disabled=false;b.textContent='Send Anonymously';alert("Couldn't send your message. Please try again.")}}async function init(){if(!t||!window.supabase||!c.url||!c.anonKey){a.innerHTML='<div class="ok"><h1>Link unavailable</h1><p>This anonymous link is no longer available.</p></div>';return}s=window.supabase.createClient(c.url,c.anonKey);let{data,error}=await s.rpc('get_public_anonymous_inbox',{p_token:t});if(error||!data?.length){a.innerHTML='<div class="ok"><h1>Link unavailable</h1><p>This anonymous link is no longer available.</p></div>';return}form()}init()})();</script></body></html>
